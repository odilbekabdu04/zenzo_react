<svg width="440" height="430" viewBox="0 0 440 430" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Zenzo logotipi</title>
<desc>To'q fonda dumaloq nishon ichida qanot uslubidagi ko'k-yashil "Z" harfi, pastida "zenzo" so'zi</desc>
<defs>
  <radialGradient id="bgGlow" cx="80%" cy="6%" r="55%">
    <stop offset="0%" stop-color="#3f5058"/>
    <stop offset="40%" stop-color="#1d262d"/>
    <stop offset="100%" stop-color="#0f1418"/>
  </radialGradient>

  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5a9a94"/>
    <stop offset="50%" stop-color="#33565a"/>
    <stop offset="100%" stop-color="#1c3033"/>
  </linearGradient>

  <linearGradient id="wingTop" x1="10%" y1="0%" x2="90%" y2="100%">
    <stop offset="0%" stop-color="#e6faf6"/>
    <stop offset="30%" stop-color="#5cc9d6"/>
    <stop offset="65%" stop-color="#1f9cc4"/>
    <stop offset="100%" stop-color="#0f5f92"/>
  </linearGradient>

  <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1c1f22"/>
    <stop offset="45%" stop-color="#123044"/>
    <stop offset="100%" stop-color="#0a2436"/>
  </linearGradient>

  <linearGradient id="wingBottom" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f5f92"/>
    <stop offset="40%" stop-color="#1f9cc4"/>
    <stop offset="75%" stop-color="#7fd8e0"/>
    <stop offset="100%" stop-color="#cff3f0"/>
  </linearGradient>

  <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#eaf8f6"/>
    <stop offset="100%" stop-color="#bfe6e0"/>
  </linearGradient>
</defs>

<rect width="440" height="430" fill="url(#bgGlow)"/>

<!-- dumaloq nishon: ikki yoy segment -->
<circle cx="220" cy="172" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="30"
        stroke-linecap="round" opacity="0.5"
        stroke-dasharray="150 40 230" stroke-dashoffset="-10"/>
<circle cx="220" cy="172" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6"/>

<!-- Z harfi: qanotsimon oqim uslubi -->
<g>
  <!-- yuqori qanot: chapdan qalin boshlanib, o'ngga uchli tugaydi -->
  <path d="M118 118
           C 118 100, 134 90, 152 92
           C 196 96, 244 92, 288 74
           C 306 66, 322 70, 330 82
           C 300 92, 268 108, 244 128
           C 274 118, 302 100, 322 78
           C 310 96, 288 116, 262 132
           C 288 122, 312 106, 330 86
           C 316 106, 288 130, 256 146
           C 226 160, 196 158, 172 150
           C 148 142, 130 130, 118 118 Z"
        fill="url(#wingTop)"/>

  <!-- diagonal band -->
  <path d="M262 128
           C 240 152, 210 182, 186 206
           C 172 220, 162 232, 156 244
           C 176 224, 202 200, 226 178
           C 252 154, 278 132, 296 112
           C 306 100, 302 88, 288 86
           C 278 84, 268 90, 262 100
           C 248 118, 230 138, 210 156
           C 236 132, 258 108, 274 88
           C 262 104, 240 128, 218 150
           C 244 128, 266 104, 280 84
           Z"
        fill="url(#diagGrad)" opacity="0.92"/>

  <!-- pastki qanot: o'ngga qalin, chapga uchli tugaydi -->
  <path d="M322 260
           C 322 278, 306 288, 288 286
           C 244 282, 196 286, 152 304
           C 134 312, 118 308, 110 296
           C 140 286, 172 270, 196 250
           C 166 260, 138 278, 118 300
           C 130 282, 152 262, 178 246
           C 152 256, 128 272, 110 292
           C 124 272, 152 248, 184 232
           C 214 218, 244 220, 268 228
           C 292 236, 310 248, 322 260 Z"
        fill="url(#wingBottom)"/>
</g>

<circle cx="220" cy="172" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.4"/>

<text x="220" y="352" text-anchor="middle"
      font-family="'Segoe UI', Arial, sans-serif" font-weight="700"
      font-size="72" letter-spacing="2" fill="url(#textGrad)">zenzo</text>
</svg>